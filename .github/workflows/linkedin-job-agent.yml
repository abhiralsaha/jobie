name: LinkedIn job agent

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      endpoint:
        description: Endpoint to call
        required: true
        type: choice
        options:
          - cron
          - test-telegram
        default: cron

permissions:
  contents: read

concurrency:
  group: linkedin-job-agent-cron
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger job agent
        env:
          VERCEL_CRON_URL: ${{ vars.VERCEL_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: ${{ github.event_name == 'workflow_dispatch' && inputs.endpoint || 'cron' }}
        run: |
          set -eu
          if [ -z "$VERCEL_CRON_URL" ]; then
            echo "Set the VERCEL_CRON_URL Actions variable to the deployed Vercel domain."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Set the CRON_SECRET Actions secret to the same value configured in Vercel."
            exit 1
          fi
          case "$ENDPOINT" in
            cron|test-telegram) ;;
            *)
              echo "Unsupported endpoint: $ENDPOINT"
              exit 1
              ;;
          esac
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 --retry-all-errors --max-time 300 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${VERCEL_CRON_URL%/}/$ENDPOINT"

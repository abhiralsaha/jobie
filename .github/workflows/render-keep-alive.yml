name: Render keep-alive

on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send keep-alive ping
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
          JOBIE_API_TOKEN: ${{ secrets.JOBIE_API_TOKEN }}
        run: |
          set -eu
          if [ -z "$RENDER_SERVICE_URL" ] || [ -z "$JOBIE_API_TOKEN" ]; then
            echo "Set the RENDER_SERVICE_URL and JOBIE_API_TOKEN repository secrets."
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 10 --retry-all-errors --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${JOBIE_API_TOKEN}" \
            "${RENDER_SERVICE_URL%/}/keep-alive"

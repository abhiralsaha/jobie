services:
  - type: worker            # background worker = never sleeps (paid plan). See README.
    name: linkedin-job-agent
    runtime: docker
    plan: starter
    autoDeploy: false
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: TELEGRAM_CHAT_ID, sync: false }
      - { key: LLM_PROVIDER, value: anthropic }
      - { key: LLM_API_KEY, sync: false }
      - { key: LLM_MODEL, value: claude-haiku-5-5 }
      - { key: KEYWORDS, value: full stack developer }
      - { key: LOCATIONS, value: "Gurgaon,Noida,Bengaluru" }
